name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Quality & Tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Linting
        run: yarn lint

      - name: Typechecking
        run: yarn typecheck

      - name: Unit Tests
        run: yarn test

  cd:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Deploy to AWS Lambda
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: sa-east-1
      LAMBDA_FUNCTION_NAME: fidelizei-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Lambda package
        run: yarn build:lambda

      - name: Validar secret AWS_ROLE_ARN
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Defina o secret AWS_ROLE_ARN em Settings → Secrets and variables → Actions."
            exit 1
          fi
          if ! [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+$ ]]; then
            echo "::error::AWS_ROLE_ARN não é um ARN de role IAM válido."
            exit 1
          fi
          if [[ "$AWS_ROLE_ARN" != *":role/${LAMBDA_FUNCTION_NAME}-github-deploy" ]]; then
            echo "::error::AWS_ROLE_ARN deve apontar para a role ${LAMBDA_FUNCTION_NAME}-github-deploy (output github_deploy_role_arn do Terraform)."
            exit 1
          fi

      - name: Run database migrations
        run: yarn migrate:latest
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_USER: ${{ vars.DB_USER }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_SSL: "true"
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Deploy code to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://dist/lambda.zip \
            --query "LastUpdateStatus" --output text
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"
